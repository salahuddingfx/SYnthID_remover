[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthid-remover"
version = "1.0.0"
description = "SynthID and AI Watermark Remover for images and videos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.8.0",
    "pillow>=9.0.0",
    "piexif>=1.1.3",
]

[project.scripts]
synthid-remover = "synthid_remover.cli.main:main"

